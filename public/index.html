<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Send a video once</title><link rel="stylesheet" href="/app.css"></head>
<body><main>
<h1>Send a video once</h1>
<p class="lead">The recipient needs your 6-digit key. After the first download, the file is deleted.</p>
<form id="f" class="card">
<label for="video">Video file</label>
<input id="video" name="video" type="file" accept=".mp4,.m4v,.mov,.3gp,.3g2,.webm,.mkv,.avi,video/*" required>
<div class="hint">mp4, m4v, mov, 3gp, webm, mkv or avi. Contents are verified on upload.</div>
<label for="key">6-digit key</label>
<input id="key" name="key" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" required>
<div class="hint">Share the key through a different channel than the link.</div>
<label for="ttl">Delete automatically if not downloaded within</label>
<select id="ttl" name="ttl"><option value="1">1 hour</option><option value="6">6 hours</option><option value="24" selected>24 hours</option><option value="48">48 hours</option></select>
<progress id="p" class="hidden" max="100" value="0"></progress>
<button id="go">Upload and create link</button>
<div id="msg" class="msg hidden" role="status"></div>
</form>
<script src="/send.js"></script>
</main></body></html>
