<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Download video</title><link rel="stylesheet" href="/app.css"></head>
<body><main>
<h1>Download video</h1>
<p class="lead">Enter the 6-digit key from the sender. You can download this file only once.</p>
<form id="f" class="card hidden">
<label for="key">6-digit key</label>
<input id="key" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" required>
<button id="go">Unlock and download</button>
<div class="hint">The file is deleted as soon as the download starts.</div>
</form>
<div id="msg" class="msg hidden" role="status"></div>
<script src="/receive.js"></script>
</main></body></html>
