services:
  - type: web
    name: vault-share
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 100
      - key: DATABASE_URL
        fromDatabase:
          name: vault-db
          property: connectionString
databases:
  - name: vault-db
    plan: free
