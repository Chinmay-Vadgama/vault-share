services:
  - type: web
    name: vault-share
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 100
      - key: SCAN_URL
        sync: false
      - key: SCAN_API_KEY
        sync: false
      - key: SCAN_HEALTH_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: E2E_POLICY
        value: optional
      - key: BIND_DOWNLOAD_IP
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: vault-db
          property: connectionString
databases:
  - name: vault-db
    plan: free
